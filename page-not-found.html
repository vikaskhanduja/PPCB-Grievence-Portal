<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Coming Soon | Green Initiative</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- ✅ Lottie Player -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b3d2e, #1e7f5c);
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #ecfff6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 2.5rem;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, .35);
    }

    .gradient-text {
      background: linear-gradient(135deg, #2ecc71, #a8ffcf);
      -webkit-background-clip: text;
      color: transparent;
    }

    .btn-green {
      background: #2ecc71;
      border: none;
      color: #063b24;
      font-weight: 600;
    }

    .btn-green:hover {
      background: #27b863;
      color: #063b24;
    }
  </style>
</head>

<body>

  <div class="glass">
    <div class="row align-items-center g-4">
      <div class="col-lg-12">
        <h1 class="fw-bold mb-3">
          We’re <span class="gradient-text">Coming Soon</span>
        </h1>

        <p class="mb-4">
          Building a sustainable platform focused on environmental protection,
          renewable energy, and a better tomorrow.
        </p>



        <!-- ✅ Email -->
        <form class="row g-2 mb-4">
          <div class="col-md">
            <input type="email" class="form-control form-control-lg" placeholder="Enter your email" required>
          </div>
          <div class="col-md-auto d-grid">
            <button class="btn btn-green btn-lg">Notify Me</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>

</html>
